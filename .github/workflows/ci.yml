name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The Ox module is built from JDK 21 on, the Kyo module from JDK 25 on.
        java: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # `+` runs every task once per Scala version a module is built for (3 and 2.13; 3.9 for Ox and Kyo).
      - run: sbt +test
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sbt-dynver needs the history and tags to compute the version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25" # the JDK that has every module
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # Builds the jars, sources, Scaladoc and POMs exactly as a release would, without signing.
      - run: sbt +publishLocal
  live:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: sbt "examples/runMain examples.Models"
